<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Gerar legislativasMunicipios.json</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 16px;
      }
      button {
        padding: 10px 18px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-size: 1rem;
      }
      #status {
        margin-top: 16px;
        font-size: 0.95rem;
      }
      .ok {
        color: green;
      }
      .err {
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>Gerar ficheiro json corrigido</h1>
    <p>
      Esta página lê <code>data/legislativas_municipios_raw.json</code>, limpa e
      estrutura os dados e faz o download automático do ficheiro
      <code>legislativasMunicipios.json</code>.
    </p>

    <div class="align-items-center">
      <input type="file" id="file" accept="json/*" />
      <div class="row">
        <button id="btn">Gerar e descarregar JSON</button>
      </div>
    </div>

    <script type="module" src="./cleanData.js"></script>
  </body>
</html>
